parent=keycloak.v2

# The brand palette (cream background, green accents) doesn't have a dark-mode
# counterpart, so always render the light variant regardless of OS preference.
darkMode=false

# Re-declare the parent's styles list (theme.properties values are not merged across
# the parent chain) so branding.css loads last and can override keycloak.v2's CSS variables.
styles=css/styles.css vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css css/branding.css

# "Powered by" logos shown below the login card (see footer.ftl). Entries are
# comma-separated, each "<image file under resources/img>:<alt text>" (alt text
# may contain spaces). A child theme that sets parent=ozone can swap these out
# entirely just by overriding this one property and dropping its own image
# files in its own resources/img/ - no template (.ftl) or CSS changes needed.
poweredByLogos=openmrs-logo.svg:OpenMRS, odoo-logo.svg:Odoo, senaite-small.png:SENAITE, superset-logo-small.png:Superset
