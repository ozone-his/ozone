# Generated by ozonectl — do not edit. Regenerate with: ozonectl manifest
apps: [openmrs, odoo, senaite]
integrations: [eip-openmrs-senaite, eip-odoo-openmrs]
modes: {proxy: true, sso: true}
db-init: [openmrs, odoo, senaite, eip-openmrs-senaite, eip-odoo-openmrs, keycloak]

# The ordered -f chain for 'run'
compose-files:
  - other/init.yml
  - other/mysql.yml
  - other/postgresql.yml
  - other/redis.yml
  - apps/openmrs.yml
  - apps/odoo.yml
  - apps/senaite.yml
  - integrations/eip-openmrs-senaite.yml
  - integrations/eip-odoo-openmrs.yml
  - other/proxy.yml
  - sso/keycloak.yml
  - sso/openmrs.yml
  - sso/odoo.yml
  - sso/senaite.yml
  - sso/eip-odoo-openmrs.yml

# The pre-computed restore invocation: 'run' chain + these files,
# with these restore gate profiles active
restore:
  compose-files:
    - support/restore.yml
    - support/backup.yml
    - sso/restore.yml
  profiles: [keycloak-restore, openmrs-restore, odoo-restore, senaite-restore]

# Ad-hoc chains: 'up <mode>' runs the base + the mode's files
mode-chains:
  proxy: [other/init.yml, other/proxy.yml]
  logging-agent: [other/init.yml, support/logging-agent.yml]
  sso: [other/init.yml, other/postgresql.yml, sso/keycloak.yml]
  backup: [other/init.yml, support/backup.yml]
  demo-data: [other/init.yml, support/demo-data.yml, sso/demo-data.yml]
